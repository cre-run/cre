name: Deploy Message Editor

on:
  push:
    branches: [main]
    paths:
      - apps/message-editor/**
      - packages/asset/**
      - packages/editor-payload/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-message-editor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-message-editor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/message-editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
          cache: true

      - name: Build
        run: vp build

      # `vp run` は環境変数を引き継がずキャッシュも効くため、デプロイは wrangler を直接実行する
      - name: Deploy cre-editor to Cloudflare Workers
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
