name: Deploy Message Editor

on:
  push:
    branches: [main]
    paths:
      - apps/message-editor/**
      - packages/asset/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-message-editor.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-message-editor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/message-editor
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      - name: Build
        run: vp build

      # `vp run` は環境変数を引き継がずキャッシュも効くため、デプロイは wrangler を直接実行する
      - name: Deploy cre-editor to Cloudflare Workers
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
