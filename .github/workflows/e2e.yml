name: E2E

# E2E（Playwright）。ジョブはアプリごと（パスの絞り込みはワークフロー全体で共通なので、どちらかの変更で両方が動く）。
# - e2e: apps/message-editor
# - e2e-short-url: apps/short-url（ガイドの流れと約束をなぞる。画像は撮らない）
#
# apps/message-editor の E2E:
# - e2e/critical-path.e2e.ts: 壊れるとガイドの手順が成り立たなくなる操作
# - e2e/guide-*.e2e.ts: ガイドの手順をなぞり、ガイドの画像（apps/docs/docs/message-editor/*.png）と比べる（VRT）
# - e2e/readme.e2e.ts: README の先頭の画像（.github/assets/readme-hero.png）と比べる（VRT）
# 画像の差分で失敗したら、意図した変更なら PR に `update-screenshots` ラベルを付けて撮り直す（update-screenshots.yml）。
# フォントなどの描画差をなくすため、基準画像を撮るときと同じコンテナで実行する。

on:
  pull_request:
    paths:
      - apps/message-editor/**
      - apps/docs/docs/message-editor/**
      - .github/assets/**
      - apps/short-url/**
      - apps/docs/docs/short-url/**
      - packages/asset/**
      - packages/editor-payload/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/message-editor/**
      - apps/docs/docs/message-editor/**
      - .github/assets/**
      - apps/short-url/**
      - apps/docs/docs/short-url/**
      - packages/asset/**
      - packages/editor-payload/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/e2e.yml
  # update-screenshots.yml が撮り直しのコミット後に呼び出す（ボットの push で起きた PR の CI は承認待ちになるため）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # バージョンは pnpm-workspace.yaml の catalog の @playwright/test と合わせる
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        working-directory: apps/message-editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install CJK fonts
        run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
          cache: true

      - name: Run E2E
        run: vp exec playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/message-editor/playwright-report/
            apps/message-editor/test-results/
          retention-days: 14

  e2e-short-url:
    runs-on: ubuntu-latest
    # e2e と同じコンテナ（ブラウザの版を @playwright/test と合わせる）。画像は撮らないのでフォントは入れない
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    defaults:
      run:
        working-directory: apps/short-url
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.1"
          cache: true

      # Access の代わり・短縮 URL の Worker・E2E 専用の Bot・Message Editor を起動する（playwright.config.ts）
      - name: Run E2E
        run: vp exec playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-short-url
          path: |
            apps/short-url/playwright-report/
            apps/short-url/test-results/
          retention-days: 14
