name: E2E

# apps/message-editor の E2E（Playwright）。
# - e2e/critical-path.e2e.ts: 壊れるとガイドの手順が成り立たなくなる操作
# - e2e/guide-*.e2e.ts: ガイドの手順をなぞり、ガイドの画像（apps/docs/docs/features/*.png）と比べる（VRT）
# 画像の差分で失敗したら、意図した変更なら PR に `update-screenshots` ラベルを付けて撮り直す（update-screenshots.yml）。
# フォントなどの描画差をなくすため、基準画像を撮るときと同じコンテナで実行する。

on:
  pull_request:
    paths:
      - apps/message-editor/**
      - apps/docs/docs/features/**
      - packages/asset/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/message-editor/**
      - apps/docs/docs/features/**
      - packages/asset/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/e2e.yml
  # update-screenshots.yml が撮り直しのコミット後に呼び出す（ボットの push で起きた PR の CI は承認待ちになるため）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # バージョンは pnpm-workspace.yaml の catalog の @playwright/test と合わせる
    container: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    defaults:
      run:
        working-directory: apps/message-editor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install CJK fonts
        run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "v24.21.0"
          cache: true

      - name: Run E2E
        run: vp exec playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            apps/message-editor/playwright-report/
            apps/message-editor/test-results/
          retention-days: 14
