name: Update Screenshots

# PR に `update-screenshots` ラベルが付いたら、ガイドの画像（apps/docs/docs/message-editor/*.png）と
# README の先頭の画像（.github/assets/readme-hero.png）を E2E のコンテナで撮り直し、E2E がすべて通ったときだけ PR のブランチにコミットする。
# 差分が意図どおりかは、人が PR の画像差分（Files changed）とプレビューで確かめ、マージで承認する。

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  # 撮り直し後に CI・E2E・ドキュメントのプレビューを workflow_dispatch で呼び出すため
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  LABEL: update-screenshots
  PR_NUMBER: ${{ github.event.pull_request.number }}
  HEAD_REF: ${{ github.event.pull_request.head.ref }}
  GH_TOKEN: ${{ github.token }}

jobs:
  update:
    # フォークや Dependabot の PR には push できないので実行しない
    if: >-
      github.event.label.name == 'update-screenshots' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # e2e.yml と同じコンテナ（バージョンは catalog の @playwright/test と合わせる）
    container: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    steps:
      # コミットのために git を、API 呼び出しのために curl と jq を入れる（checkout より前に必要）
      - name: Install CJK fonts and tools
        run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk git curl jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24.22.2"
          cache: true

      # `all` で全画像を撮り直す。既定（changed）は比較に落ちた画像だけを上書きするため、
      # 閾値（maxDiffPixelRatio）未満の小さな変化（ヘッダのバッジなど）が画像に反映されないまま残る
      - name: Update guide and README screenshots
        id: update
        working-directory: apps/message-editor
        run: vp exec playwright test e2e/guide- e2e/readme --update-snapshots=all

      # 撮り直した画像で、クリティカルパスを含めてすべて通ることを確かめてからコミットする
      - name: Run E2E
        id: e2e
        working-directory: apps/message-editor
        run: vp exec playwright test

      # 確かめたコミット（tested）の上にだけ画像を積む。実行中にブランチが動いて push が拒否されたら、
      # 新しいコードでは確かめていないので rebase せず、moved として失敗させる（コメントで付け直しを促す）
      - name: Commit and push
        id: commit
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add apps/docs/docs/message-editor/*.png .github/assets/*.png
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tested=$(git rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: update guide and README screenshots"
          if ! git push origin "HEAD:$HEAD_REF"; then
            git fetch --depth=1 origin "$HEAD_REF"
            remote=$(git rev-parse FETCH_HEAD)
            if [ "$remote" != "$tested" ]; then
              echo "push=moved" >> "$GITHUB_OUTPUT"
              echo "remote_sha=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"
              echo "::error::実行中に $HEAD_REF が $(git rev-parse --short "$tested") から $(git rev-parse --short "$remote") に進んだため、push が拒否されました"
            fi
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN（ボット）の push で起きた PR のワークフローは、人の承認待ち（action_required）で止まる。
      # 承認なしで新しいコミットを確かめられるよう、workflow_dispatch で直接呼び出す。
      # 画像だけの変更なので、message-editor のプレビューは変わらず呼び出さない
      - name: Rerun CI, E2E and docs preview on the new commit
        id: dispatch
        if: steps.commit.outputs.changed == 'true'
        run: |
          dispatch() {
            curl -fsS -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/$1/dispatches" \
              -d "$2"
          }
          dispatch ci.yml "$(jq -n --arg ref "$HEAD_REF" '{ref: $ref}')"
          dispatch e2e.yml "$(jq -n --arg ref "$HEAD_REF" '{ref: $ref}')"
          dispatch preview-docs.yml "$(jq -n --arg ref "$HEAD_REF" --arg pr "$PR_NUMBER" '{ref: $ref, inputs: {pr: $pr}}')"

      # どのステップで止まったかを、各ステップの outcome から判断してコメントする
      - name: Comment result
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          UPDATE_OUTCOME: ${{ steps.update.outcome }}
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          PUSH: ${{ steps.commit.outputs.push }}
          REMOTE_SHA: ${{ steps.commit.outputs.remote_sha }}
          CHANGED: ${{ steps.commit.outputs.changed }}
          SHA: ${{ steps.commit.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "cancelled" ] && [ "$CHANGED" = "true" ]; then
            body="ガイドと README の画像を撮り直して ${SHA} をコミットしたあとで中断しました（ラベルの付け直しなどで新しい実行に置き換わったか、手動で取り消されました）。CI・E2E・ドキュメントのプレビューを呼び出せたかは実行ログで確かめ、呼び出せていなければ Actions から手動で実行してください。"
          elif [ "$JOB_STATUS" = "cancelled" ]; then
            body="ガイドと README の画像の撮り直しを中断しました（ラベルの付け直しなどで新しい実行に置き換わったか、手動で取り消されました）。コミットしていません。"
          elif [ "$UPDATE_OUTCOME" = "failure" ]; then
            body="ガイドと README の画像を撮り直せませんでした（撮り直しのステップが失敗したため、コミットしていません）。"
          elif [ "$E2E_OUTCOME" = "failure" ]; then
            body="ガイドと README の画像を撮り直しましたが、撮り直した画像で E2E が失敗したため、コミットしていません。"
          elif [ "$PUSH" = "moved" ]; then
            body="ガイドと README の画像の撮り直しと E2E は通りましたが、実行中に PR のブランチへ新しいコミット（${REMOTE_SHA}）が push されたため、push が拒否されました。確かめていないコードに画像を載せないよう、PR には反映していません。新しいコードで撮り直すには \`$LABEL\` ラベルを付け直してください。"
          elif [ "$COMMIT_OUTCOME" = "failure" ]; then
            body="ガイドと README の画像の撮り直しと E2E は通りましたが、コミットか push に失敗しました。"
          elif [ "$DISPATCH_OUTCOME" = "failure" ]; then
            body="ガイドと README の画像を撮り直して ${SHA} をコミットしましたが、CI・E2E・ドキュメントのプレビューの呼び出しに失敗しました。Actions から手動で実行してください。"
          elif [ "$JOB_STATUS" != "success" ]; then
            body="ガイドと README の画像を撮り直せませんでした（撮り直しの前の準備で失敗したため、コミットしていません）。"
          elif [ "$CHANGED" = "true" ]; then
            body="ガイドと README の画像を撮り直して ${SHA} をコミットしました。Files changed の画像差分が意図どおりか確認してください。"
          else
            body="ガイドと README の画像に差分はありませんでした。"
          fi
          body="$body [実行ログ]($RUN_URL)"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            -d "$(jq -n --arg body "$body" '{body: $body}')"

      # 付けたままだと次に付け直せないので外す
      - name: Remove label
        if: always()
        run: |
          curl -fsS -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels/$LABEL" || true
