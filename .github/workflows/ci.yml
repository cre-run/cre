name: CI

on:
  pull_request:
  push:
    branches: [main]
  # update-screenshots.yml が撮り直しのコミット後に呼び出す（ボットの push で起きた PR の CI は承認待ちになるため）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      # format + lint + typecheck
      - run: vp check
      - run: vp run -r test
      - run: vp run -r build
