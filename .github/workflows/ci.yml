name: CI

on:
  pull_request:
  push:
    branches: [main]
  # update-screenshots.yml が撮り直しのコミット後に呼び出す（ボットの push で起きた PR の CI は承認待ちになるため）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "v24.21.0"
          cache: true

      # format + lint + typecheck
      - run: vp check
      # 機密の検査スクリプトのテスト（検査そのものは confidential.yml）
      - run: node --test scripts/check-confidential.test.mjs scripts/review-push.test.mjs
      - run: vp run -r test
      - run: vp run -r build
