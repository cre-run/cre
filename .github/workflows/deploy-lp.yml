name: Deploy LP

on:
  push:
    branches: [main]
    paths:
      - apps/lp/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy-lp.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      # `vp run` は環境変数を引き継がずキャッシュも効くため、デプロイは wrangler を直接実行する
      - name: Deploy cre-lp to Cloudflare Workers
        working-directory: apps/lp
        run: vp exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
