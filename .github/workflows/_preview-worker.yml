name: Preview Worker

# apps/<app> を Cloudflare Worker Previews（pr-<番号>）にデプロイし、URL を PR にコメントする共通ワークフロー。
# preview-docs.yml / preview-message-editor.yml から呼び出す。削除は preview-cleanup.yml で行う。
# https://developers.cloudflare.com/workers/previews/

on:
  workflow_call:
    inputs:
      app:
        description: apps/ 以下のディレクトリ名（wrangler.jsonc がある場所）
        required: true
        type: string
      title:
        description: PR コメントの見出しに使う名前
        required: true
        type: string
      build:
        description: apps/<app> で実行するビルドコマンド
        required: true
        type: string
      pr:
        # workflow_dispatch の入力は文字列で渡ってくることがあるので string で受ける
        description: PR の番号（workflow_dispatch からも呼ぶため、イベントからは読まない）
        required: true
        type: string
      sha:
        description: プレビューにするコミット（PR コメントに表示する）
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

env:
  PREVIEW_NAME: pr-${{ inputs.pr }}
  COMMENT_MARKER: "<!-- preview-${{ inputs.app }} -->"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: "v24.21.0"
          cache: true

      - name: Build
        run: ${{ inputs.build }}

      # `vp run` は環境変数を引き継がずキャッシュも効くため、wrangler を直接実行する
      - name: Deploy Worker Preview
        id: preview
        # URL は wrangler の出力ファイル（ND-JSON）の type: "preview" の行から読む
        run: |
          vp exec wrangler preview --name "$PREVIEW_NAME" --message "PR #$PR_NUMBER $HEAD_SHA"
          url=$(jq -r 'select(.type == "preview") | .preview_urls[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          # preview_urls は本番デプロイ（wrangler deploy）で反映される。未反映だと URL が付かない
          if [ -z "$url" ]; then
            echo "::warning::Preview $PREVIEW_NAME was deployed but has no URL. Deploy production once with preview_urls: true."
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.sha }}

      # 同じコメントを更新し続ける（プッシュごとに増やさない）
      - name: Comment preview URL
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            link="$PREVIEW_URL"
          else
            link="プレビューは作成しましたが、URL がまだありません。本番の Worker に \`preview_urls: true\` が反映される（この設定を含む変更が main に入り、本番デプロイが走る）と URL が付きます。"
          fi
          body=$(printf '%s\n### %sのプレビュー\n\n%s\n\nコミット: %s（プッシュのたびに同じ URL が更新されます）\n' \
            "$COMMENT_MARKER" "$TITLE" "$link" "$HEAD_SHA")
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$COMMENT_MARKER\")) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.sha }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          TITLE: ${{ inputs.title }}
