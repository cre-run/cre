name: Confidential

# 非公開の内容（機密の印・非公開リポジトリへの参照・非公開パッケージ・禁止語）が混ざっていないかを検査する。
#
# PR では pull_request_target で動かす。ワークフロー定義と検査スクリプトは base（main）のものが使われ、
# PR の head は別ディレクトリに checkout して「データとして走査」するだけでコードは実行しない。
# これにより、PR 側で検査を無効化したり Secret CONFIDENTIAL_TERMS を外部へ送る変更を入れても効かない。
# （pull_request で PR 側の定義を実行すると、同一リポジトリのブランチからは Secret に触れてしまう）
#
# 禁止語は Secret CONFIDENTIAL_TERMS（1 行 1 語。無いなら `# none`）。同一リポジトリの PR と push では
# Secret が無いと失敗する（fail closed）。フォークの PR には Secret を渡さない（pull_request_target は
# フォークにも Secret を供給できるが、候補名を並べた PR とエラーの行番号で禁止語を照合できてしまうため）。
# フォークと Dependabot は組み込みパターンだけを検査し、警告を出す。
# PR の題名・本文の編集でも再実行する（edited）。フォークのコミット範囲は、base の checkout から base SHA を取り込んで検査する。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: confidential-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  confidential:
    runs-on: ubuntu-latest
    steps:
      # 信頼済みの検査コード（pull_request_target では base、push では main）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 検査対象: PR の head。コードは実行せず、ファイルとコミットメッセージを読むだけ
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request_target'
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0

      # フォークの clone には base のコミットが無いので、base の checkout（このワークスペース）から取り込む
      - name: コミット範囲の検査のために base SHA を取り込む
        if: github.event_name == 'pull_request_target'
        run: git -C target fetch --no-tags "$GITHUB_WORKSPACE" "${{ github.event.pull_request.base.sha }}"

      - name: base に検査スクリプトがあることを確かめる
        run: test -f scripts/check-confidential.mjs || { echo "::error::base に scripts/check-confidential.mjs がありません"; exit 1; }

      - name: 機密の検査（信頼済みのスクリプトで PR の内容を走査）
        working-directory: ${{ github.event_name == 'pull_request_target' && 'target' || '.' }}
        run: node "$GITHUB_WORKSPACE/scripts/check-confidential.mjs" --ci
        env:
          # フォークの PR には Secret を渡さない（同一リポジトリの PR と push だけ）
          CONFIDENTIAL_TERMS: ${{ (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.CONFIDENTIAL_TERMS || '' }}
          CONFIDENTIAL_EXTRA_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
          CONFIDENTIAL_COMMIT_RANGE: ${{ github.event_name == 'pull_request_target' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || '' }}
          CONFIDENTIAL_REQUIRE_TERMS: ${{ (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]' }}
