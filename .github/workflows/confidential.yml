name: Confidential

# 非公開の内容の印（機密の印・非公開リポジトリへの参照・非公開パッケージ）が混ざっていないかを検査する。
# 文脈依存の判断（顧客名・価格など）は push 前の AI レビュー（scripts/review-push.mjs）と PR のレビューが行う。
# PR の題名・本文の編集（edited）でも再実行する。

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  confidential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # コミット範囲（中間コミットの追加行とメッセージ）も検査する
      - run: node scripts/check-confidential.mjs --ci
        env:
          CONFIDENTIAL_EXTRA_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
          CONFIDENTIAL_COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
