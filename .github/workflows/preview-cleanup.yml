name: Preview Cleanup

# PR を閉じたら、各アプリの Worker Preview（pr-<番号>）を削除する。
# 途中で変更を取り消した PR でも消せるよう、パスでは絞り込まない。

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    # フォークや Dependabot の PR では Actions のシークレットが使えない（プレビューも作られていない）
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        app: [docs, message-editor]
    # preview-<app>.yml と同じグループに入れ、作成中のデプロイを取り消してから削除する
    concurrency:
      group: preview-${{ matrix.app }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: "24"
          cache: true

      # そのアプリに触れていない PR ではプレビューがない。その場合（API エラー 10025: Preview not found）だけ
      # 正常終了とし、認証や API の失敗などはジョブを失敗させて気づけるようにする
      - name: Delete Worker Preview
        run: |
          set +e
          out=$(vp exec wrangler preview delete --name "pr-$PR_NUMBER" --skip-confirmation 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -ne 0 ]; then
            if grep -q "code: 10025" <<< "$out"; then
              echo "::notice::No Worker Preview pr-$PR_NUMBER to delete."
            else
              exit "$status"
            fi
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
