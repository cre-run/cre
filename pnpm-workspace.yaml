packages:
  - apps/*
  - packages/*

catalogMode: prefer

# 公開から3日（4320分）経っていないバージョンはインストールしない
minimumReleaseAge: 4320

catalog:
  "@types/node": 24.19.2
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  "@playwright/test": 1.64.1
  blume: 2.2.5
  wrangler: 4.152.0
  "@cloudflare/workers-types": 5.20261023.1
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
  workerd: true
